<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Kernel – Flash cards</title>
  <link rel="icon" type="image/png" href="kernel_512_grad_br.png">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#000000');
      }
    })();
  </script>
</head>
<body id="flashcards-page">
  <div id="page-loader"></div>

  <div class="quick-actions">
    <a href="/cpge/" class="action-btn" title="Accueil">
      <span class="q-icon icon-home"></span>
    </a>
    <button id="theme-toggle" class="action-btn" title="Changer de thème">
      <span class="q-icon icon-theme"></span>
    </button>
  </div>

  <main id="fc-container">
    <h2>Flash cards</h2>
    <div id="fc-list" class="item-list"></div>
  </main>

  <script src="script.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const listEl = document.getElementById('fc-list');

    function deckSlug(url) {
      try {
        return new URLSearchParams(url.split('?')[1] || '').get('deck');
      } catch (err) {
        return null;
      }
    }

    async function fetchCount(slug) {
      if (!slug) return null;
      try {
        const res = await fetch(`flashcards/${slug}.json`);
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data.cards) ? data.cards.length : null;
      } catch (err) {
        return null;
      }
    }

    try {
      const res = await fetch('list.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const subjects = await res.json();

      const decks = [];
      subjects.forEach(subcat => {
        (subcat.files || []).forEach(entry => {
          if (typeof entry === 'object' && entry !== null && entry.type === 'flashcard') {
            decks.push(entry);
          }
        });
      });

      if (!decks.length) {
        listEl.textContent = 'Aucun jeu disponible.';
        return;
      }

      decks.forEach(deck => {
        const link = document.createElement('a');
        link.href = deck.url;
        link.className = 'list-item';

        const typeIcon = document.createElement('span');
        typeIcon.className = 'icon item-type-icon icon-flashcards';
        link.appendChild(typeIcon);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'item-name';
        nameSpan.textContent = deck.name || deck.url;
        link.appendChild(nameSpan);

        const right = document.createElement('span');
        right.className = 'item-icons';
        const countSpan = document.createElement('span');
        countSpan.className = 'fc-item-count is-loading';
        countSpan.textContent = '\u2026';
        right.appendChild(countSpan);
        link.appendChild(right);

        listEl.appendChild(link);
        deck._countEl = countSpan;
      });

      await Promise.all(decks.map(async deck => {
        const n = await fetchCount(deckSlug(deck.url));
        const el = deck._countEl;
        el.classList.remove('is-loading');
        if (n === null) {
          el.remove();
        } else {
          el.textContent = n > 1 ? `${n} cartes` : `${n} carte`;
        }
      }));

    } catch (err) {
      listEl.textContent = 'Impossible de charger la liste des jeux.';
    }
  });
  </script>

</body>
</html>
